{% extends "base.html" %}

{% block title %}Modifier le tag RFID{% endblock %}

{% block content %}
<div class="container mt-4 pt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-white py-3">
                    <h5 class="m-0 fw-bold text-dark"><i class="bi bi-pencil me-2 text-primary"></i>Modifier le tag RFID</h5>
                </div>
                <div class="card-body">
                    <form method="POST" novalidate>
                        <div class="row g-3">
                            <div class="col-md-8">
                                <label class="form-label fw-semibold">Identifiant du tag RFID</label>
                                <input type="text" name="tag_id" class="form-control" value="{{ tag.tag_id }}">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Équipement associé</label>
                                <select name="equipment_id" class="form-select">
                                    <option value="" {% if not tag.equipment_id %}selected{% endif %}>Aucun</option>
                                    {% for e in equipments %}
                                    <option value="{{ e.id }}" {% if tag.equipment_id == e.id %}selected{% endif %}>{{ e.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6">
                                <div class="form-check mt-5 d-flex align-items-center">
                                    <input class="form-check-input" type="checkbox" name="is_active" id="is_active" {% if tag.is_active %}checked{% endif %}>
                                    <label class="form-check-label mb-0" for="is_active">Tag actif</label>
                                </div>
                            </div>
                        </div>
                        <hr class="my-4">
                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('rfid.tags') }}" class="btn btn-secondary">Annuler</a>
                            <button type="submit" class="btn btn-primary">Enregistrer les modifications</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
