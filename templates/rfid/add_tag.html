{% extends "base.html" %}

{% block title %}Ajouter un tag RFID{% endblock %}

{% block content %}
<div class="container mt-4 pt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-white py-3">
                    <h5 class="m-0 fw-bold text-dark"><i class="bi bi-tag-plus me-2 text-primary"></i>Enregistrer un tag RFID</h5>
                </div>
                <div class="card-body">
                    <form method="POST" novalidate>
                        <div class="row g-3">
                            <div class="col-md-8">
                                <label class="form-label fw-semibold">Identifiant du tag RFID</label>
                                <input type="text" name="tag_id" class="form-control" placeholder="Laissez vide pour générer automatiquement" value="">
                                <div class="form-text">Si laissé vide, un identifiant sera généré automatiquement (mode simulation).</div>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Équipement associé</label>
                                <select name="equipment_id" class="form-select">
                                    <option value="">Aucun</option>
                                    {% for e in equipments %}
                                    <option value="{{ e.id }}">{{ e.name }} ({{ e.serial_number }})</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6">
                                <div class="form-check mt-5 d-flex align-items-center">
                                    <input class="form-check-input" type="checkbox" name="is_active" id="is_active" checked>
                                    <label class="form-check-label mb-0" for="is_active">Tag actif</label>
                                </div>
                            </div>
                        </div>
                        <hr class="my-4">
                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('rfid.tags') }}" class="btn btn-secondary">Annuler</a>
                            <button type="submit" class="btn btn-primary">Enregistrer le tag</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
