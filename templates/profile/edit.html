{% extends "base.html" %}

{% block title %}Modifier le profil{% endblock %}

{% block content %}
<div class="container mt-4 pt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-white py-3">
                    <h5 class="m-0 fw-bold text-dark"><i class="bi bi-pencil me-2 text-primary"></i>Modifier le profil</h5>
                </div>
                <div class="card-body">
                    <form method="POST" novalidate>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nom d'utilisateur <span class="text-danger">*</span></label>
                            <input type="text" name="username" class="form-control" value="{{ user.username }}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Adresse email <span class="text-danger">*</span></label>
                            <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
                        </div>
                        <hr class="my-4">
                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('profile.index') }}" class="btn btn-secondary">Annuler</a>
                            <button type="submit" class="btn btn-primary">Enregistrer les modifications</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
